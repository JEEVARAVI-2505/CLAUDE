services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: devonly
      POSTGRES_DB: app_dev
    ports: ['127.0.0.1:5432:5432']
    volumes: [dbdata:/var/lib/postgresql/data]
  mailpit:
    image: axllent/mailpit
    ports: ['127.0.0.1:8025:8025', '127.0.0.1:1025:1025']
volumes:
  dbdata:
