name: CRM MASTER

on:
  push:
    paths: ['CRM_Master/**', '.github/workflows/crm-master.yml']
  pull_request:
    paths: ['CRM_Master/**', '.github/workflows/crm-master.yml']
  workflow_dispatch:

jobs:
  windows-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: CRM_Master
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Inno Setup (free)
        run: choco install innosetup -y --no-progress
      - name: Test, publish, zip and build installer
        shell: pwsh
        run: ./build/publish.ps1 -Version 1.0.0
      - uses: actions/upload-artifact@v4
        with:
          name: CRM_MASTER_Windows
          path: |
            CRM_Master/dist/installer/*.exe
            CRM_Master/dist/*.zip
          if-no-files-found: error
