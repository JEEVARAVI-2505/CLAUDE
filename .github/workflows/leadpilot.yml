name: LeadPilot AI

on:
  push:
    branches: ['**']
    paths: ['LeadPilot/**', '.github/workflows/leadpilot.yml']
    tags: ['leadpilot-v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  tests-linux:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: LeadPilot } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet test LeadPilot.sln -c Release

  windows-installer:
    runs-on: windows-latest
    env:
      HAS_CERT: ${{ secrets.CODESIGN_PFX_BASE64 != '' }}
    defaults: { run: { working-directory: LeadPilot } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }

      - name: Version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/leadpilot-v*') { $v = $env:GITHUB_REF.Substring('refs/tags/leadpilot-v'.Length) } else { $v = '1.0.0' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build everything (core, tests, WPF app)
        run: |
          dotnet build LeadPilot.sln -c Release
          dotnet build src/LeadPilot.Desktop/LeadPilot.Desktop.csproj -c Release

      - name: Test
        run: dotnet test LeadPilot.sln -c Release --no-build

      - name: Publish self-contained app
        run: dotnet publish src/LeadPilot.Desktop/LeadPilot.Desktop.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ steps.ver.outputs.version }} -p:PublishReadyToRun=true -o publish

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer\LeadPilotAI.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Sign installer (only if a certificate secret exists)
        if: ${{ env.HAS_CERT == 'true' }}
        shell: pwsh
        env:
          PFX: ${{ secrets.CODESIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -like '*x64*' } | Select-Object -Last 1
          & $signtool.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 artifacts\LeadPilotAI_Setup.exe

      - name: Install smoke test (silent install, data folders, database)
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\LeadPilotInstall"
          $p = Start-Process artifacts\LeadPilotAI_Setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir","/LOG=$env:RUNNER_TEMP\setup.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 60; throw "installer exit code $($p.ExitCode)" }
          foreach ($f in 'LeadPilotAI.exe','docs\USER_GUIDE.md','unins000.exe') { if (-not (Test-Path "$dir\$f")) { throw "missing $f" } }
          $data = "$env:LOCALAPPDATA\LeadPilotAI"
          foreach ($f in 'Data\leadpilot.db','Backups','Logs','Exports') { if (-not (Test-Path "$data\$f")) { throw "missing $data\$f" } }
          "Installed OK; database at $data\Data\leadpilot.db (" + (Get-Item "$data\Data\leadpilot.db").Length + " bytes)"
          "dir=$dir" >> $env:GITHUB_ENV

      - name: Launch every screen and capture screenshots
        shell: pwsh
        run: |
          $shots = "$env:RUNNER_TEMP\shots"; New-Item -ItemType Directory $shots -Force | Out-Null
          $env:LEADPILOT_DATA_DIR = "$env:RUNNER_TEMP\lp-tour-data"
          $p = Start-Process "$env:dir\LeadPilotAI.exe" -ArgumentList "--screenshot-dir","`"$shots`"" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "UI tour timed out" }
          Get-ChildItem $shots | ForEach-Object { "{0}  {1:N0} bytes" -f $_.Name, $_.Length }
          if ((Get-ChildItem $shots -Filter *.png).Count -lt 18) { Get-ChildItem "$env:LEADPILOT_DATA_DIR\Logs" -ErrorAction SilentlyContinue | Get-Content -ErrorAction SilentlyContinue | Select-Object -Last 40; throw "expected at least 18 screenshots" }
          Copy-Item $shots "$env:GITHUB_WORKSPACE\shots" -Recurse
          Get-ChildItem "$env:LEADPILOT_DATA_DIR\Logs" -ErrorAction SilentlyContinue | Copy-Item -Destination "$env:GITHUB_WORKSPACE\shots" -ErrorAction SilentlyContinue

      - name: Uninstall keeps user data
        shell: pwsh
        run: |
          Start-Process "$env:dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          if (Test-Path "$env:dir\LeadPilotAI.exe") { throw "program files were not removed" }
          if (-not (Test-Path "$env:LOCALAPPDATA\LeadPilotAI\Data\leadpilot.db")) { throw "user data was deleted by uninstall" }
          "Uninstall OK; user data preserved."

      - name: Checksums
        shell: pwsh
        run: |
          Get-FileHash artifacts\LeadPilotAI_Setup.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  LeadPilotAI_Setup.exe" } | Tee-Object artifacts\SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: LeadPilotAI_Setup
          path: |
            LeadPilot/artifacts/LeadPilotAI_Setup.exe
            LeadPilot/artifacts/SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: shots
          if-no-files-found: ignore

      - name: Publish evidence branch (screenshots + checksum)
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') }}
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "leadpilot-ci"; git config user.email "ci@users.noreply.github.com"
          $dst = "$env:RUNNER_TEMP\evidence"; New-Item -ItemType Directory $dst -Force | Out-Null
          Copy-Item shots\* $dst -ErrorAction SilentlyContinue; Copy-Item LeadPilot\artifacts\SHA256.txt $dst
          git checkout --orphan leadpilot-ci-evidence
          git rm -rf . --quiet 2>$null
          Copy-Item "$dst\*" . ; git add -A
          git commit -m "CI evidence for ${{ github.sha }}" --quiet
          git push --force origin leadpilot-ci-evidence

      - name: Create GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/leadpilot-v')
        shell: pwsh
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "${{ github.ref_name }}" artifacts\LeadPilotAI_Setup.exe artifacts\SHA256.txt --title "LeadPilot AI ${{ steps.ver.outputs.version }}" --notes-file installer\ReleaseNotes.txt
